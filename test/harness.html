<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SdFlip test harness</title>
<link rel="stylesheet" href="../src/sdflip.css">
</head>
<body style="margin:0;background:#e9ecef;font-family:Arial,sans-serif">
<p style="padding:20px;margin:0">SdFlip test harness. The tests open the viewer over this page.</p>
<p style="padding:0 20px;margin:0"><label>Open your own PDF: <input type="file" id="own-pdf" accept="application/pdf,.pdf"></label></p>
<script src="../src/sdflip.js"></script>
<script>
// a local file opens without a server, even from file://
document.getElementById('own-pdf').addEventListener('change', function () {
	var file = this.files && this.files[0];
	if (file) { window.__v = SdFlip.open({ source: file, title: file.name }); }
	this.value = '';
});
</script>
</body>
</html>
